<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Papertrail</title>
<meta name="description" content="Create a Papertrail account to publish stories, share insights, and join our author community.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand">Papertrail<span class="dot">.</span></a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="index.html#latest-articles">Explore</a>
      <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
      <a href="create-blog.html" data-page="create-blog.html">Create Blog</a>
    </nav>
    <div class="nav-actions" id="nav-actions-desktop"></div>
    <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="mobile-menu-backdrop" id="mobile-menu-backdrop"></div>
  <div class="mobile-menu" id="mobile-menu"></div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" class="brand">Papertrail<span class="dot">.</span></a>
    </div>
    <h1>Create your account</h1>
    <p class="auth-sub">Join Papertrail to write, publish, and share your perspectives.</p>

    <div class="form-banner" id="register-banner"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" autocomplete="name" placeholder="Alex Morgan" required>
        <span class="field-error" id="reg-name-error"></span>
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" autocomplete="email" placeholder="alex@example.com" required>
        <span class="field-error" id="reg-email-error"></span>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <div class="input-password-wrap">
          <input type="password" id="reg-password" autocomplete="new-password" placeholder="At least 8 characters" required>
          <button type="button" class="password-toggle-btn" id="reg-password-toggle" aria-label="Show password">
            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <span class="field-error" id="reg-password-error"></span>
      </div>

      <div class="form-group">
        <label for="reg-confirm">Confirm Password</label>
        <div class="input-password-wrap">
          <input type="password" id="reg-confirm" autocomplete="new-password" placeholder="Re-enter your password" required>
          <button type="button" class="password-toggle-btn" id="reg-confirm-toggle" aria-label="Show password">
            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <span class="field-error" id="reg-confirm-error"></span>
      </div>

      <div class="terms-row">
        <input type="checkbox" id="reg-terms">
        <label for="reg-terms">I agree to the Terms of Service and Community Guidelines.</label>
      </div>
      <span class="field-error terms-error" id="reg-terms-error"></span>

      <button type="submit" class="btn btn-primary btn-block" id="register-submit-btn">
        <span class="btn-text">Create Account</span>
      </button>
    </form>

    <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
