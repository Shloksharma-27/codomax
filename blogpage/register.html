<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Papertrail</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand">Papertrail<span class="dot">.</span></a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="index.html#latest-articles">Explore</a>
      <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
      <a href="create-blog.html" data-page="create-blog.html">Create Blog</a>
    </nav>
    <div class="nav-actions" id="nav-actions-desktop"></div>
    <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="mobile-menu" id="mobile-menu"></div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" class="brand">Papertrail<span class="dot">.</span></a>
    </div>
    <h1>Create your account</h1>
    <p class="auth-sub">Join Papertrail to write and publish your own stories.</p>

    <div class="form-banner" id="register-banner"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="reg-name">Full name</label>
        <input type="text" id="reg-name" autocomplete="name" placeholder="Jordan Lee">
        <span class="field-error" id="reg-name-error"></span>
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" autocomplete="email" placeholder="you@example.com">
        <span class="field-error" id="reg-email-error"></span>
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" autocomplete="new-password" placeholder="At least 8 characters">
        <span class="field-error" id="reg-password-error"></span>
      </div>
      <div class="form-group">
        <label for="reg-confirm">Confirm password</label>
        <input type="password" id="reg-confirm" autocomplete="new-password" placeholder="Re-enter your password">
        <span class="field-error" id="reg-confirm-error"></span>
      </div>
      <div class="terms-row">
        <input type="checkbox" id="reg-terms">
        <label for="reg-terms">I agree to the Terms of Service and Privacy Policy.</label>
      </div>
      <span class="field-error terms-error" id="reg-terms-error"></span>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
