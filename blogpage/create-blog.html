<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Blog — Papertrail</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body id="create-blog-page">

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand">Papertrail<span class="dot">.</span></a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="index.html#latest-articles">Explore</a>
      <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
      <a href="create-blog.html" data-page="create-blog.html">Create Blog</a>
    </nav>
    <div class="nav-actions" id="nav-actions-desktop"></div>
    <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="mobile-menu" id="mobile-menu"></div>
</header>

<main>
  <div class="container">
    <div class="editor-header">
      <h1 id="editor-title-heading">Write a new story</h1>
    </div>

    <div class="editor-layout">
      <div class="editor-main">
        <div>
          <input type="text" class="title-input" id="title-input" placeholder="Story title">
          <span class="field-error" id="title-error"></span>
        </div>

        <div>
          <textarea class="excerpt-input" id="excerpt-input" placeholder="Short excerpt — a sentence or two that summarizes the story"></textarea>
        </div>

        <div>
          <div class="editor-toolbar" id="editor-toolbar">
            <button type="button" data-format="bold" title="Bold" aria-label="Bold"><b>B</b></button>
            <button type="button" data-format="italic" title="Italic" aria-label="Italic"><i>I</i></button>
            <button type="button" data-format="heading" title="Heading" aria-label="Heading">H</button>
            <button type="button" data-format="quote" title="Quote" aria-label="Quote">&ldquo;</button>
            <button type="button" data-format="list" title="List" aria-label="List">&#8226;</button>
          </div>
          <textarea class="content-textarea" id="content-textarea" placeholder="Write your story here..."></textarea>
          <span class="field-error" id="content-error"></span>
        </div>
      </div>

      <div class="editor-sidebar">
        <div class="sidebar-card">
          <h4>Featured Image</h4>
          <div class="image-preview" id="image-preview">No image yet</div>
          <div class="sidebar-field">
            <label for="image-input">Image URL</label>
            <input type="text" id="image-input" placeholder="https://images.unsplash.com/...">
          </div>
        </div>

        <div class="sidebar-card">
          <h4>Organize</h4>
          <div class="sidebar-field">
            <label for="category-select">Category</label>
            <select id="category-select">
              <option value="">Select a category</option>
              <option value="Technology">Technology</option>
              <option value="Design">Design</option>
              <option value="Productivity">Productivity</option>
              <option value="Career">Career</option>
              <option value="Lifestyle">Lifestyle</option>
            </select>
            <span class="field-error" id="category-error"></span>
          </div>
          <div class="sidebar-field">
            <label for="tag-input">Tags</label>
            <input type="text" id="tag-input" placeholder="Type a tag and press Enter">
            <div class="tag-list" id="tag-list"></div>
          </div>
        </div>

        <div class="sidebar-card">
          <h4>Publish</h4>
          <div class="publish-actions">
            <button type="button" class="btn btn-primary btn-block" id="publish-btn">Publish</button>
            <button type="button" class="btn btn-secondary btn-block" id="save-draft-btn">Save Draft</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/create-blog.js"></script>
</body>
</html>
