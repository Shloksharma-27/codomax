<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Papertrail</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand">Papertrail<span class="dot">.</span></a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="index.html#latest-articles">Explore</a>
      <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
      <a href="create-blog.html" data-page="create-blog.html">Create Blog</a>
    </nav>
    <div class="nav-actions" id="nav-actions-desktop"></div>
    <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="mobile-menu" id="mobile-menu"></div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" class="brand">Papertrail<span class="dot">.</span></a>
    </div>
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to manage your stories and drafts.</p>

    <div class="form-banner" id="login-banner"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="email" placeholder="you@example.com">
        <span class="field-error" id="login-email-error"></span>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" placeholder="Your password">
        <span class="field-error" id="login-password-error"></span>
      </div>
      <div class="form-row-between">
        <label class="checkbox-row">
          <input type="checkbox" id="login-remember">
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
