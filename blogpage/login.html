<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Papertrail</title>
<meta name="description" content="Sign in to your Papertrail author account to manage your stories, drafts, and analytics.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand">Papertrail<span class="dot">.</span></a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="index.html#latest-articles">Explore</a>
      <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
      <a href="create-blog.html" data-page="create-blog.html">Create Blog</a>
    </nav>
    <div class="nav-actions" id="nav-actions-desktop"></div>
    <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="mobile-menu-backdrop" id="mobile-menu-backdrop"></div>
  <div class="mobile-menu" id="mobile-menu"></div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" class="brand">Papertrail<span class="dot">.</span></a>
    </div>
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to manage your articles, drafts, and author dashboard.</p>

    <div class="form-banner" id="login-banner"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" autocomplete="email" placeholder="name@example.com" required>
        <span class="field-error" id="login-email-error"></span>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="input-password-wrap">
          <input type="password" id="login-password" autocomplete="current-password" placeholder="Enter your password" required>
          <button type="button" class="password-toggle-btn" id="login-password-toggle" aria-label="Show password">
            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <span class="field-error" id="login-password-error"></span>
      </div>

      <div class="form-row-between">
        <label class="checkbox-row">
          <input type="checkbox" id="login-remember">
          Remember me
        </label>
        <a href="#" class="forgot-link" id="forgot-password-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">
        <span class="btn-text">Log in</span>
      </button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="register.html">Create one now</a></p>
  </div>
</main>

<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
